<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calgen App - Referral Redirect</title>
    <style>
        :root {
            --bg-color: #111B21;
            --card-color: #202C33;
            --text-color: #FFFFFF;
            --accent-color: #16B649; /* Matching primary theme color */
            --accent-hover: #129E3D;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            text-align: center;
        }

        .container {
            padding: 2.5rem;
            max-width: 420px;
            width: 90%;
            background-color: var(--card-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            letter-spacing: -1px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            margin: 2rem auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p {
            font-size: 0.95rem;
            color: #A0AEC0;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.85rem 0;
            background-color: var(--accent-color);
            color: #FFFFFF;
            font-weight: 700;
            text-decoration: none;
            border-radius: 12px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(22, 182, 73, 0.3);
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.75rem;
            color: #718096;
        }
    </style>
    <script>
        function getMobileStoreUrl() {
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            
            // Play Store App details URL
            var androidUrl = "https://play.google.com/store/apps/details?id=com.calgen.app";
            
            // App Store URL (Replace with your actual iOS App Store link)
            var iosUrl = "https://apps.apple.com/app/idYOUR_APPLE_APP_ID"; 
            
            // Fallback landing page (Desktop users)
            var fallbackUrl = "https://caligen.tech";

            if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
                return iosUrl;
            } else if (/android/i.test(userAgent)) {
                return androidUrl;
            }
            return fallbackUrl;
        }

        function doRedirect() {
            var targetUrl = getMobileStoreUrl();
            document.getElementById("redirect-btn").href = targetUrl;
            
            // Delay redirection slightly so the user sees transition intent
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 1200);
        }

        window.onload = doRedirect;
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">Calgen</div>
        <div class="spinner"></div>
        <h2>Opening App Store...</h2>
        <p>We are redirecting you to download the Calgen application. If the download does not start automatically, please click below.</p>
        
        <a id="redirect-btn" href="#" class="btn">Download App</a>
        
        <div class="footer">
            &copy; 2026 Calgen Tech. All rights reserved.
        </div>
    </div>
</body>
</html>
